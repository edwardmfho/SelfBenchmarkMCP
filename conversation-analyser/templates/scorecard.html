<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conversation Scorecard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --base-bg: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.7);
      --glass-border: rgba(255, 255, 255, 0.1);
      --primary: #38bdf8;
      --secondary: #818cf8;
      --accent: #f472b6;
      --success: #34d399;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --gradient-1: linear-gradient(135deg, #38bdf8 0%, #818cf8 100%);
      --gradient-2: linear-gradient(135deg, #f472b6 0%, #fb923c 100%);
      --radius: 24px;
      --transition: .3s cubic-bezier(.4, 0, .2, 1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Outfit', sans-serif;
      background-color: var(--base-bg);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 40px 20px;
      background-image:
        radial-gradient(circle at 10% 10%, rgba(56, 189, 248, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 90% 90%, rgba(244, 114, 182, 0.08) 0%, transparent 40%);
    }

    .container {
      width: 100%;
      max-width: 900px;
      animation: fadeIn 0.8s ease-out;
    }

    .glass {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--glass-border);
      border-radius: 32px;
      padding: 40px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
    }

    header {
      text-align: center;
      margin-bottom: 40px;
    }

    header h1 {
      font-size: 2.8rem;
      font-weight: 700;
      background: var(--gradient-1);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 10px;
      letter-spacing: -1px;
    }

    .meta-badges {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .badge {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      padding: 6px 14px;
      border-radius: 100px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--glass-border);
      color: var(--text-muted);
    }

    .hero-stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
      padding-bottom: 30px;
      border-bottom: 1px solid var(--glass-border);
    }

    .h-stat {
      text-align: center;
    }

    .h-stat-val {
      font-size: 2rem;
      font-weight: 700;
      display: block;
      color: var(--primary);
    }

    .text-success {
      color: var(--success);
    }

    .text-accent {
      color: var(--accent);
    }

    .h-stat-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Comparison Bar Chart */
    .comparison-chart {
      margin-bottom: 40px;
      padding: 20px;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .chart-title {
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      margin-bottom: 15px;
      text-align: center;
    }

    .bar-container {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 12px;
    }

    .bar-label {
      width: 100px;
      text-align: right;
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .bar-track {
      flex: 1;
      height: 24px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      overflow: hidden;
      position: relative;
    }

    .bar-fill {
      height: 100%;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding-right: 10px;
      font-size: 0.8rem;
      font-weight: 600;
      color: white;
      min-width: 40px;
      transition: width 1s ease-out;
    }

    .bar-manual {
      background: var(--secondary);
    }

    .bar-agentic {
      background: var(--success);
    }

    .summary-box {
      background: rgba(255, 255, 255, 0.03);
      border-radius: 20px;
      padding: 25px;
      margin-bottom: 40px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      line-height: 1.7;
    }

    .grid-sections {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
      gap: 30px;
    }

    h2 {
      font-size: 1.3rem;
      margin-bottom: 20px;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* Accordion / Cards */
    .section-card {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 20px;
      margin-bottom: 15px;
      overflow: hidden;
      transition: var(--transition);
    }

    .section-card:hover {
      border-color: var(--primary);
      background: rgba(255, 255, 255, 0.04);
    }

    .card-header {
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      user-select: none;
    }

    .card-title {
      font-weight: 600;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .score-chip {
      background: var(--gradient-1);
      color: white;
      padding: 2px 10px;
      border-radius: 100px;
      font-size: 0.75rem;
      font-weight: 700;
    }

    .card-content {
      padding: 0 20px;
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.4s ease, padding 0.4s ease;
      font-size: 0.9rem;
      color: var(--text-muted);
      line-height: 1.6;
    }

    .section-card.open .card-content {
      max-height: 1000px;
      padding: 0 20px 20px;
    }

    .time-breakdown {
      display: flex;
      gap: 15px;
      margin-top: 10px;
      font-size: 0.8rem;
      color: var(--text-muted);
      background: rgba(0, 0, 0, 0.2);
      padding: 8px 12px;
      border-radius: 8px;
    }

    .findings-list {
      list-style: none;
    }

    .finding-item {
      display: flex;
      gap: 12px;
      padding: 12px 15px;
      background: rgba(129, 140, 248, 0.05);
      border-radius: 14px;
      margin-bottom: 10px;
      border-left: 3px solid var(--secondary);
      font-size: 0.9rem;
    }

    footer {
      text-align: center;
      margin-top: 50px;
      padding-top: 20px;
      border-top: 1px solid var(--glass-border);
      color: var(--text-muted);
      font-size: 0.75rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(15px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 600px) {
      .glass {
        padding: 25px;
      }

      header h1 {
        font-size: 2rem;
      }

      .grid-sections {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="glass" id="app">
      <header>
        <h1 id="title">Analytics Dashboard</h1>
        <div class="meta-badges" id="badges"></div>
      </header>

      <div class="hero-stats" id="hero-stats"></div>

      <div id="comparison-container"></div>

      <div class="summary-box">
        <p id="summary">Analyzing conversation data...</p>
      </div>

      <div class="grid-sections">
        <div class="col">
          <h2 id="sections-label">🔍 Analysis Sections</h2>
          <div id="sections-container"></div>
        </div>
        <div class="col">
          <h2>💡 Key Findings</h2>
          <div id="findings-container" class="findings-list"></div>
        </div>
      </div>

      <footer id="footer">
        Generated by Conversation Analyser
      </footer>
    </div>
  </div>

  <script id="scorecard-data" type="application/json">null</script>

  <script>
    const DATA = JSON.parse(document.getElementById('scorecard-data').textContent);

    if (DATA) {
      // Title & Badges
      document.getElementById('title').textContent = (DATA.work_type || 'Conversation').replace(/_/g, ' ') + ' Analysis';

      const badgeList = [DATA.analysis_type, DATA.model_used, DATA.source_format].filter(Boolean);
      document.getElementById('badges').innerHTML = badgeList.map(b => `<span class="badge">${b}</span>`).join('');

      // Hero Stats
      const statItems = [];

      if (DATA.total_manual_time && DATA.total_agentic_time) {
        // If we have specific benchmark data
        statItems.push({ label: 'Manual Time', val: DATA.total_manual_time + 'h' });
        statItems.push({ label: 'Agentic Time', val: DATA.total_agentic_time + 'h', class: 'text-success' });
        const saved = (DATA.total_savings || (DATA.total_manual_time - DATA.total_agentic_time)).toFixed(1);
        statItems.push({ label: 'Time Saved', val: saved + 'h', class: 'text-accent' });
      } else {
        // Generic fallback
        statItems.push({ label: 'Turns', val: DATA.turn_count });
        statItems.push({ label: 'Chunks', val: DATA.chunk_count });
        statItems.push({ label: 'Type', val: DATA.analysis_type });
      }

      document.getElementById('hero-stats').innerHTML = statItems.map(s => `
        <div class="h-stat">
          <span class="h-stat-val ${s.class || ''}">${s.val || '—'}</span>
          <span class="h-stat-label">${s.label}</span>
        </div>
      `).join('');

      // Visual Comparison (only for benchmark)
      if (DATA.total_manual_time && DATA.total_agentic_time) {
        const manual = parseFloat(DATA.total_manual_time);
        const agentic = parseFloat(DATA.total_agentic_time);
        const max = Math.max(manual, agentic) * 1.1; // 10% buffering

        const manualPct = (manual / max) * 100;
        const agenticPct = (agentic / max) * 100;

        document.getElementById('comparison-container').innerHTML = `
            <div class="comparison-chart">
                <div class="chart-title">Manual vs Agentic Workflow Efficiency</div>
                <div class="bar-container">
                    <div class="bar-label">Manual</div>
                    <div class="bar-track">
                        <div class="bar-fill bar-manual" style="width: ${manualPct}%">${manual}h</div>
                    </div>
                </div>
                <div class="bar-container">
                    <div class="bar-label">Agentic (AI)</div>
                    <div class="bar-track">
                        <div class="bar-fill bar-agentic" style="width: ${agenticPct}%">${agentic}h</div>
                    </div>
                </div>
            </div>
          `;
      }

      // Summary
      document.getElementById('summary').textContent = DATA.summary;

      // Sections (Accordion)
      const sectionsLabel = DATA.analysis_type === 'benchmark' ? '🏢 Work Categories' : '🔍 Analysis Sections';
      document.getElementById('sections-label').innerHTML = sectionsLabel;

      const sectionsContainer = document.getElementById('sections-container');
      (DATA.sections || []).forEach((sec, idx) => {
        const card = document.createElement('div');
        card.className = 'section-card';

        let scoreHtml = '';
        if (sec.savings) {
          scoreHtml = `<span class="score-chip" style="background:var(--success)">-${sec.savings}h</span>`;
        } else if (sec.score !== undefined && sec.score !== null) {
          scoreHtml = `<span class="score-chip">${DATA.analysis_type === 'benchmark' ? sec.score + 'h' : Math.round(sec.score * 100) + '%'}</span>`;
        }

        let extraContent = '';
        if (sec.manual_time && sec.agentic_time) {
          extraContent = `
                <div class="time-breakdown">
                    <span>⏳ Manual: ${sec.manual_time}h</span>
                    <span>🤖 Agentic: ${sec.agentic_time}h</span>
                </div>
            `;
        }

        card.innerHTML = `
          <div class="card-header">
            <span class="card-title">${sec.title}</span>
            <div style="display: flex; align-items: center; gap: 10px;">
              ${scoreHtml}
              <span class="arrow">▼</span>
            </div>
          </div>
          <div class="card-content">
            ${sec.content}
            ${extraContent}
          </div>
        `;

        card.querySelector('.card-header').onclick = () => {
          card.classList.toggle('open');
          card.querySelector('.arrow').style.transform = card.classList.contains('open') ? 'rotate(180deg)' : 'rotate(0deg)';
        };

        sectionsContainer.appendChild(card);
      });

      // Findings
      const findingsContainer = document.getElementById('findings-container');
      (DATA.key_findings || []).forEach(f => {
        const item = document.createElement('div');
        item.className = 'finding-item';
        item.innerHTML = `<span>⚡</span><span>${f}</span>`;
        findingsContainer.appendChild(item);
      });

      document.getElementById('footer').textContent = `Generated by Conversation Analyser MCP • ${new Date().toLocaleDateString()}`;
    }
  </script>
</body>

</html>
