<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inbox Intelligence Brief</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg-paper: #FDFBF7;
      --text-ink: #1a1a1a;
      --text-muted: #595959;
      --accent-red: #C53030;
      --accent-gold: #D69E2E;
      --border-heavy: 2px solid #1a1a1a;
      --border-light: 1px solid #e5e5e5;
      --font-serif: 'Playfair Display', serif;
      --font-sans: 'Inter', sans-serif;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: var(--bg-paper);
      color: var(--text-ink);
      font-family: var(--font-sans);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      padding: 40px 20px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      position: relative;
    }

    /* HEADER / MASTHEAD */
    header {
      text-align: center;
      border-bottom: var(--border-heavy);
      padding-bottom: 20px;
      margin-bottom: 40px;
      position: relative;
    }

    header::after {
      content: "";
      position: absolute;
      bottom: 4px;
      left: 0;
      right: 0;
      border-bottom: 1px solid #1a1a1a;
    }

    .masthead-meta {
      font-family: var(--font-sans);
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--text-muted);
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: 4rem;
      font-weight: 700;
      letter-spacing: -1px;
      line-height: 1;
      margin-bottom: 5px;
    }

    .sub-masthead {
      font-family: var(--font-serif);
      font-style: italic;
      font-size: 1.2rem;
      color: var(--text-muted);
    }

    /* HERO STATS - "The Ticker" */
    .hero-ticker {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      border-bottom: var(--border-light);
      padding-bottom: 30px;
      margin-bottom: 40px;
    }

    .ticker-item {
      text-align: center;
      padding: 0 20px;
      border-right: var(--border-light);
    }

    .ticker-item:last-child {
      border-right: none;
    }

    .ticker-val {
      font-family: var(--font-serif);
      font-size: 3.5rem;
      font-weight: 700;
      display: block;
      line-height: 1;
      margin-bottom: 5px;
    }

    .ticker-label {
      font-family: var(--font-sans);
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
    }

    /* IMPACT STORIES - "The Lead Stories" */
    .section-header {
      font-family: var(--font-sans);
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      border-bottom: 2px solid #1a1a1a;
      padding-bottom: 5px;
      margin-bottom: 25px;
      display: inline-block;
    }

    .story-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 30px;
      margin-bottom: 50px;
    }

    .story-card {
      padding: 25px;
      background: #fff;
      border: 1px solid #e5e5e5;
      box-shadow: 2px 2px 0 rgba(0, 0, 0, 0.05);
      transition: transform 0.2s ease;
    }

    .story-card:hover {
      transform: translateY(-2px);
      box-shadow: 4px 4px 0 rgba(0, 0, 0, 0.05);
    }

    .story-title {
      font-family: var(--font-serif);
      font-size: 1.4rem;
      font-weight: 700;
      margin-bottom: 10px;
      color: var(--text-ink);
    }

    .story-comparison {
      display: flex;
      align-items: baseline;
      gap: 15px;
      margin-bottom: 15px;
      font-family: var(--font-sans);
      font-size: 0.9rem;
      color: var(--text-muted);
      border-bottom: 1px solid #f0f0f0;
      padding-bottom: 15px;
    }

    .comp-segment strong {
      color: var(--text-ink);
      font-weight: 600;
    }

    .arrow-sep {
      color: #ccc;
    }

    .story-narrative {
      font-family: var(--font-serif);
      font-style: italic;
      font-size: 1.1rem;
      color: var(--text-ink);
    }

    /* SUMMARY & FINDINGS - "Editorial & Briefs" */
    .layout-cols {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 40px;
    }

    .editorial-col {
      padding-right: 30px;
      border-right: var(--border-light);
    }



    .editorial-text {
      font-family: var(--font-serif);
      font-size: 1.1rem;
      line-height: 1.8;
      margin-bottom: 20px;
    }

    .bullet-list {
      list-style: none;
      padding: 0;
    }

    .bullet-item {
      margin-bottom: 15px;
      padding-left: 20px;
      position: relative;
      font-size: 0.95rem;
      color: var(--text-muted);
    }

    .bullet-item::before {
      content: "•";
      position: absolute;
      left: 0;
      color: var(--accent-red);
      font-weight: bold;
    }

    /* CATEGORY TABLE - "The Ledger" */
    .ledger-table {
      width: 100%;
      border-collapse: collapse;
      font-family: var(--font-sans);
      font-size: 0.9rem;
      margin-top: 10px;
    }

    .ledger-table th {
      text-align: left;
      text-transform: uppercase;
      font-size: 0.75rem;
      letter-spacing: 1px;
      border-bottom: 2px solid #1a1a1a;
      padding: 10px 0;
      color: var(--text-muted);
    }

    .ledger-table td {
      padding: 12px 0;
      border-bottom: 1px solid #eee;
    }

    .ledger-num {
      font-variant-numeric: tabular-nums;
      text-align: right;
    }

    .savings-tag {
      display: inline-block;
      background: #E6FFFA;
      color: #2C7A7B;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    footer {
      text-align: center;
      margin-top: 60px;
      padding-top: 20px;
      border-top: var(--border-light);
      font-family: var(--font-sans);
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    @media (max-width: 768px) {
      h1 {
        font-size: 2.5rem;
      }

      .hero-ticker {
        grid-template-columns: 1fr;
        gap: 20px;
      }

      .ticker-item {
        border-right: none;
        border-bottom: 1px solid #eee;
        padding-bottom: 20px;
      }

      .layout-cols {
        grid-template-columns: 1fr;
      }

      .editorial-col {
        border-right: none;
        padding-right: 0;
        border-bottom: 1px solid #eee;
        padding-bottom: 30px;
        margin-bottom: 30px;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <!-- MASTHEAD -->
    <header>
      <div class="masthead-meta">
        <span id="date-display">...</span>
        <span>Self-Benchmark Series</span>
        <span>Vol. <span id="vol-num">1</span></span>
      </div>
      <h1>Inbox Intelligence</h1>
      <div class="sub-masthead">An Efficiency Report on Your Recent Digital Activity</div>
    </header>

    <!-- HERO TICKER -->
    <div class="hero-ticker" id="hero-ticker">
      <!-- Injected via JS -->
    </div>

    <!-- IMPACT STORIES -->
    <div id="stories-section" style="display:none;">
      <div class="section-header">The Efficiency Log</div>
      <div class="story-grid" id="story-grid">
        <!-- Stories injected here -->
      </div>
    </div>

    <!-- MAIN CONTENT COLS -->
    <div class="layout-cols">
      <!-- LEFT: Summary & Ledger -->
      <div class="editorial-col">
        <div class="section-header">Executive Brief</div>
        <div class="editorial-text" id="summary-text">
          <!-- Summary injected here -->
        </div>

        <div style="margin-top: 40px;">
          <div class="section-header">Activity Ledger</div>
          <table class="ledger-table">
            <thead>
              <tr>
                <th>Category</th>
                <th>Activity</th>
                <th class="ledger-num">Pre-AI</th>
                <th class="ledger-num">With AI</th>
                <th class="ledger-num">Saved</th>
              </tr>
            </thead>
            <tbody id="ledger-body">
              <!-- Ledger rows injected here -->
            </tbody>
          </table>
        </div>
      </div>

      <!-- RIGHT: Key Findings -->
      <div class="briefs-col">
        <div class="section-header">Key Findings</div>
        <ul class="bullet-list" id="findings-list">
          <!-- Findings injected here -->
        </ul>
      </div>
    </div>

    <footer>
      Generated by Conversation Analyser MCP • CONFIDENTIAL BRIEF
    </footer>
  </div>

  <script id="scorecard-data" type="application/json">null</script>

  <script>
    const DATA = JSON.parse(document.getElementById('scorecard-data').textContent);

    function formatDate() {
      const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
      return new Date().toLocaleDateString('en-US', options);
    }
    document.getElementById('date-display').textContent = formatDate();
    document.getElementById('vol-num').textContent = Math.floor(Math.random() * 100) + 1; // Simulation

    if (DATA) {
      // 1. HERO TICKER
      const tickerEl = document.getElementById('hero-ticker');
      let tickerHtml = '';

      if (DATA.total_manual_time && DATA.total_agentic_time) {
        // Benchmark Mode
        const saved = DATA.total_savings || (DATA.total_manual_time - DATA.total_agentic_time);
        tickerHtml = `
                    <div class="ticker-item">
                        <span class="ticker-val">${DATA.total_manual_time}h</span>
                        <span class="ticker-label">Manual Effort</span>
                    </div>
                    <div class="ticker-item">
                        <span class="ticker-val" style="color: var(--accent-gold);">${DATA.total_agentic_time}h</span>
                        <span class="ticker-label">Agentic Effort</span>
                    </div>
                    <div class="ticker-item">
                        <span class="ticker-val" style="color: var(--accent-red);">${saved.toFixed(1)}h</span>
                        <span class="ticker-label">Time Reclaimed</span>
                    </div>
                `;
      } else {
        // Standard Mode
        tickerHtml = `
                    <div class="ticker-item">
                        <span class="ticker-val">${DATA.turn_count || 0}</span>
                        <span class="ticker-label">Total Turns</span>
                    </div>
                    <div class="ticker-item">
                        <span class="ticker-val">${DATA.chunk_count || 1}</span>
                        <span class="ticker-label">Analysis Chunks</span>
                    </div>
                     <div class="ticker-item">
                        <span class="ticker-val" style="font-size: 2rem;">${(DATA.analysis_type || 'General').substring(0, 10)}</span>
                        <span class="ticker-label">Focus Area</span>
                    </div>
                `;
      }
      tickerEl.innerHTML = tickerHtml;

      // 2. IMPACT STORIES (If available)
      if (DATA.impact_stories && DATA.impact_stories.length > 0) {
        document.getElementById('stories-section').style.display = 'block';
        const gridEl = document.getElementById('story-grid');
        gridEl.innerHTML = DATA.impact_stories.map(story => `
                    <div class="story-card">
                        <div class="story-title">${story.description}</div>
                        <div class="story-comparison">
                            <span class="comp-segment">Traditional: <strong>${story.manual_duration}</strong></span>
                            <span class="arrow-sep">→</span>
                            <span class="comp-segment">Agentic: <strong>${story.ai_duration}</strong></span>
                        </div>
                        <div class="story-narrative">"${story.impact_summary}"</div>
                    </div>
                `).join('');
      }

      // 3. EXECUTIVE BRIEF (Summary)
      document.getElementById('summary-text').textContent = DATA.summary;

      // 4. ACTIVITY LEDGER (Sections)
      const ledgerBody = document.getElementById('ledger-body');
      (DATA.sections || []).forEach(sec => {
        const tr = document.createElement('tr');

        // Content truncation
        const contentShort = sec.content.length > 60 ? sec.content.substring(0, 60) + '...' : sec.content;

        // Savings badge
        let savedCell = '—';
        if (sec.savings) {
          savedCell = `<span class="savings-tag">-${sec.savings}h</span>`;
        }

        tr.innerHTML = `
                    <td><strong>${sec.title}</strong></td>
                    <td style="color: var(--text-muted);">${contentShort}</td>
                    <td class="ledger-num">${sec.manual_time ? sec.manual_time + 'h' : '—'}</td>
                    <td class="ledger-num">${sec.agentic_time ? sec.agentic_time + 'h' : '—'}</td>
                    <td class="ledger-num">${savedCell}</td>
                `;
        ledgerBody.appendChild(tr);
      });

      // 5. KEY FINDINGS
      const listEl = document.getElementById('findings-list');
      (DATA.key_findings || []).forEach(f => {
        const li = document.createElement('li');
        li.className = 'bullet-item';
        li.textContent = f;
        listEl.appendChild(li);
      });
    }
  </script>
</body>

</html>
