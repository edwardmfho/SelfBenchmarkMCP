<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inbox Intelligence Brief</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg-paper: #FDFBF7;
      --text-ink: #1a1a1a;
      --text-muted: #595959;
      --accent-red: #C53030;
      --accent-gold: #D69E2E;
      --accent-blue: #2B6CB0;
      --border-heavy: 2px solid #1a1a1a;
      --border-light: 1px solid #e5e5e5;
      --font-serif: 'Playfair Display', serif;
      --font-sans: 'Inter', sans-serif;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: var(--bg-paper);
      color: var(--text-ink);
      font-family: var(--font-sans);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      padding: 40px 20px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      position: relative;
    }

    /* HEADER */
    header {
      text-align: center;
      border-bottom: var(--border-heavy);
      padding-bottom: 20px;
      margin-bottom: 40px;
      position: relative;
    }

    header::after {
      content: "";
      position: absolute;
      bottom: 4px;
      left: 0;
      right: 0;
      border-bottom: 1px solid #1a1a1a;
    }

    .masthead-meta {
      font-family: var(--font-sans);
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--text-muted);
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: 4rem;
      font-weight: 700;
      letter-spacing: -1px;
      line-height: 1;
      margin-bottom: 5px;
    }

    .sub-masthead {
      font-family: var(--font-serif);
      font-style: italic;
      font-size: 1.2rem;
      color: var(--text-muted);
    }

    /* HERO STATS - "The Multiplier" */
    .hero-ticker {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      border-bottom: var(--border-light);
      padding-bottom: 30px;
      margin-bottom: 40px;
      gap: 20px;
      /* Added gap for better spacing */
    }

    .ticker-item {
      text-align: center;
      padding: 0 10px;
      border-right: var(--border-light);
    }

    .ticker-item:last-child {
      border-right: none;
    }

    .ticker-label {
      font-family: var(--font-sans);
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      margin-bottom: 5px;
      display: block;
    }

    .ticker-val {
      font-family: var(--font-serif);
      font-size: 3rem;
      font-weight: 700;
      display: block;
      line-height: 1.1;
    }

    .ticker-sub {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 5px;
      font-style: italic;
    }

    /* IMPACT STORIES & CHARTS */
    .section-header {
      font-family: var(--font-sans);
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      border-bottom: 2px solid #1a1a1a;
      padding-bottom: 5px;
      margin-bottom: 25px;
      display: inline-block;
    }

    .story-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 40px;
      margin-bottom: 60px;
    }

    .story-card {
      padding: 0;
      background: transparent;
    }

    .story-title {
      font-family: var(--font-serif);
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 5px;
      color: var(--text-ink);
    }

    .story-narrative {
      font-family: var(--font-serif);
      font-style: italic;
      font-size: 1.05rem;
      color: var(--text-muted);
      margin-bottom: 20px;
      display: block;
    }

    /* CHART STYLES */
    .chart-container {
      margin-top: 15px;
      background: #f0f0f0;
      height: 40px;
      width: 100%;
      position: relative;
      border-radius: 4px;
      /* Slight rounded corners */
      overflow: hidden;
      display: flex;
    }

    .bar-manual {
      background-color: #cbd5e0;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding-right: 10px;
      color: #4a5568;
      font-size: 0.8rem;
      font-weight: 600;
      transition: width 1s ease-in-out;
    }

    .bar-agentic {
      background-color: var(--accent-gold);
      height: 100%;
      display: flex;
      align-items: center;
      padding-left: 10px;
      color: white;
      font-size: 0.8rem;
      font-weight: 600;
      transition: width 1s ease-in-out;
      position: absolute;
      /* Overlay if needed, or flex */
      top: 0;
      left: 0;
      z-index: 2;
      /* We'll use a specific visual trick: A vs B bars separately might be clearer 
                BUT user asked for "how many time I have saved... as opposed to without AI" 
                A stacked bar where Total = Manual, and a subset is Agentic visualizes the saving well?
                Actually, simpler: Two bars. */
    }

    /* Standard Bar Chart (Manual vs Agentic) */
    .comparison-bars {
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-family: var(--font-sans);
      font-size: 0.85rem;
    }

    .bar-row {
      display: grid;
      grid-template-columns: 100px 1fr 60px;
      align-items: center;
      gap: 15px;
    }

    .bar-label {
      text-align: right;
      font-weight: 500;
      color: var(--text-muted);
    }

    .bar-track {
      background: #eee;
      height: 24px;
      width: 100%;
      position: relative;
      border-radius: 3px;
    }

    .bar-fill {
      height: 100%;
      border-radius: 3px;
      min-width: 2px;
    }

    .fill-manual {
      background-color: #A0AEC0;
    }

    .fill-agentic {
      background-color: var(--accent-gold);
    }

    .fill-saved {
      background-color: var(--accent-blue);
      opacity: 0.2;
    }

    /* Visual gap */

    .bar-value {
      font-weight: 600;
      color: var(--text-ink);
    }


    /* SUMMARY & LEDGER */
    .layout-cols {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 40px;
    }

    .editorial-col {
      padding-right: 30px;
      border-right: var(--border-light);
    }

    .editorial-text {
      font-family: var(--font-serif);
      font-size: 1.1rem;
      line-height: 1.8;
      margin-bottom: 20px;
    }

    .bullet-list {
      margin-bottom: 20px;
      padding-left: 20px;
    }

    .bullet-item {
      margin-bottom: 10px;
      font-size: 0.95rem;
      color: var(--text-muted);
    }

    .ledger-table {
      width: 100%;
      border-collapse: collapse;
      font-family: var(--font-sans);
      font-size: 0.9rem;
      margin-top: 10px;
    }

    .ledger-table th {
      text-align: left;
      text-transform: uppercase;
      font-size: 0.75rem;
      letter-spacing: 1px;
      border-bottom: 2px solid #1a1a1a;
      padding: 10px 0;
      color: var(--text-muted);
    }

    .ledger-table td {
      padding: 12px 0;
      border-bottom: 1px solid #eee;
    }

    .ledger-num {
      font-variant-numeric: tabular-nums;
      text-align: right;
    }

    .savings-tag {
      display: inline-block;
      background: #E6FFFA;
      color: #2C7A7B;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    footer {
      text-align: center;
      margin-top: 60px;
      padding-top: 20px;
      border-top: var(--border-light);
      font-family: var(--font-sans);
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    @media (max-width: 768px) {
      h1 {
        font-size: 2.5rem;
      }

      .hero-ticker {
        grid-template-columns: 1fr;
        gap: 30px;
      }

      .ticker-item {
        border-right: none;
        border-bottom: 1px solid #eee;
        padding-bottom: 20px;
      }

      .layout-cols {
        grid-template-columns: 1fr;
      }

      .editorial-col {
        border-right: none;
        padding-right: 0;
        border-bottom: 1px solid #eee;
        padding-bottom: 30px;
        margin-bottom: 30px;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <!-- MASTHEAD -->
    <header>
      <div class="masthead-meta">
        <span id="date-display">...</span>
        <span>Self-Benchmark Series</span>
        <span>Vol. <span id="vol-num">1</span></span>
      </div>
      <h1>Inbox Intelligence</h1>
      <div class="sub-masthead">Productivity Benchmark & Force Multiplier Report</div>
    </header>

    <!-- HERO TICKER -->
    <div class="hero-ticker" id="hero-ticker">
      <!-- Injected via JS -->
    </div>

    <!-- IMPACT STORIES (Charts) -->
    <div id="stories-section" style="display:none;">
      <div class="section-header">Operational Wins</div>
      <div class="story-grid" id="story-grid">
        <!-- Stories injected here -->
      </div>
    </div>

    <!-- MAIN CONTENT COLS -->
    <div class="layout-cols">
      <!-- LEFT: Summary & Ledger -->
      <div class="editorial-col">
        <div class="section-header">Executive Summary</div>
        <div class="editorial-text" id="summary-text">
          <!-- Summary injected here -->
        </div>

        <div style="margin-top: 40px;">
          <div class="section-header">Activity Ledger</div>
          <table class="ledger-table">
            <thead>
              <tr>
                <th>Category</th>
                <th>Activity</th>
                <th class="ledger-num">Manual</th>
                <th class="ledger-num">Agentic</th>
                <th class="ledger-num">Saved</th>
              </tr>
            </thead>
            <tbody id="ledger-body">
              <!-- Ledger rows injected here -->
            </tbody>
          </table>
        </div>
      </div>

      <!-- RIGHT: Key Findings -->
      <div class="briefs-col">
        <div class="section-header">Key Findings</div>
        <ul class="bullet-list" id="findings-list">
          <!-- Findings injected here -->
        </ul>
      </div>
    </div>

    <footer>
      Generated by Conversation Analyser MCP • CONFIDENTIAL BRIEF
    </footer>
  </div>

  <script id="scorecard-data" type="application/json">null</script>

  <script>
    const DATA = JSON.parse(document.getElementById('scorecard-data').textContent);

    function formatDate() {
      const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
      return new Date().toLocaleDateString('en-US', options);
    }
    document.getElementById('date-display').textContent = formatDate();
    document.getElementById('vol-num').textContent = Math.floor(Math.random() * 100) + 1;

    if (DATA) {
      // 1. HERO TICKER (Force Multiplier Focus)
      const tickerEl = document.getElementById('hero-ticker');
      let tickerHtml = '';

      if (DATA.total_manual_time && DATA.total_agentic_time) {
        // Benchmark Mode
        const multiplier = DATA.force_multiplier || (DATA.total_manual_time / DATA.total_agentic_time).toFixed(1);
        const employees = DATA.employee_equivalent || (DATA.total_manual_time / 40).toFixed(1);
        const saved = DATA.total_savings || (DATA.total_manual_time - DATA.total_agentic_time);

        tickerHtml = `
                    <div class="ticker-item">
                        <span class="ticker-label">Force Multiplier</span>
                        <span class="ticker-val" style="color: var(--text-ink);">${multiplier}x</span>
                        <div class="ticker-sub">Output achieved vs manual effort</div>
                    </div>
                    <div class="ticker-item">
                        <span class="ticker-label">Virtual Workforce</span>
                        <span class="ticker-val" style="color: var(--accent-gold);">${employees} FTE</span>
                        <div class="ticker-sub">Full-time employee equivalent output</div>
                    </div>
                    <div class="ticker-item">
                        <span class="ticker-label">Time Reclaimed</span>
                        <span class="ticker-val" style="color: var(--accent-red);">${saved.toFixed(1)}h</span>
                         <div class="ticker-sub">Hours saved this period</div>
                    </div>
                `;
      } else {
        // Standard Mode Fallback
        tickerHtml = `
                    <div class="ticker-item">
                        <span class="ticker-label">Total Turns</span>
                        <span class="ticker-val">${DATA.turn_count || 0}</span>
                    </div>
                    <div class="ticker-item">
                         <span class="ticker-label">Analysis Chunks</span>
                        <span class="ticker-val">${DATA.chunk_count || 1}</span>
                    </div>
                     <div class="ticker-item">
                        <span class="ticker-label">Focus Area</span>
                        <span class="ticker-val" style="font-size: 2rem;">${(DATA.analysis_type || 'General').substring(0, 10)}</span>
                    </div>
                `;
      }
      tickerEl.innerHTML = tickerHtml;

      // 2. IMPACT STORIES (Charts)
      if (DATA.impact_stories && DATA.impact_stories.length > 0) {
        document.getElementById('stories-section').style.display = 'block';
        const gridEl = document.getElementById('story-grid');

        gridEl.innerHTML = DATA.impact_stories.map(story => {
          // Calculate percentages for bars
          const manual = parseFloat(story.manual_hours || 0);
          const ai = parseFloat(story.ai_hours || 0);

          // Sanity check
          if (!manual) return '';

          const max = Math.max(manual, ai) * 1.05; // 5% buffer
          const manualPct = (manual / max) * 100;
          const aiPct = (ai / max) * 100;

          return `
                    <div class="story-card">
                        <div class="story-title">${story.description}</div>
                        <div class="story-narrative">"${story.impact_summary}"</div>
                        <div class="comparison-bars">
                            <div class="bar-row">
                                <span class="bar-label">Manual</span>
                                <div class="bar-track">
                                    <div class="bar-fill fill-manual" style="width: ${manualPct}%"></div>
                                </div>
                                <span class="bar-value">${story.manual_duration}</span>
                            </div>
                            <div class="bar-row">
                                <span class="bar-label" style="color: var(--accent-gold)">Agentic</span>
                                <div class="bar-track">
                                    <div class="bar-fill fill-agentic" style="width: ${aiPct}%"></div>
                                </div>
                                <span class="bar-value" style="color: var(--accent-gold)">${story.ai_duration}</span>
                            </div>
                        </div>
                    </div>
                `}).join('');
      }

      // 3. EXECUTIVE BRIEF (Summary)
      document.getElementById('summary-text').textContent = DATA.summary;

      // 4. ACTIVITY LEDGER
      const ledgerBody = document.getElementById('ledger-body');
      (DATA.sections || []).forEach(sec => {
        const tr = document.createElement('tr');
        const contentShort = sec.content.length > 50 ? sec.content.substring(0, 50) + '...' : sec.content;
        let savedCell = '—';
        if (sec.savings) {
          savedCell = `<span class="savings-tag">-${sec.savings}h</span>`;
        }
        tr.innerHTML = `
                    <td><strong>${sec.title}</strong></td>
                    <td style="color: var(--text-muted);">${contentShort}</td>
                    <td class="ledger-num">${sec.manual_time ? sec.manual_time + 'h' : '—'}</td>
                    <td class="ledger-num">${sec.agentic_time ? sec.agentic_time + 'h' : '—'}</td>
                    <td class="ledger-num">${savedCell}</td>
                `;
        ledgerBody.appendChild(tr);
      });

      // 5. KEY FINDINGS
      const listEl = document.getElementById('findings-list');
      (DATA.key_findings || []).forEach(f => {
        const li = document.createElement('li');
        li.className = 'bullet-item';
        li.textContent = f;
        listEl.appendChild(li);
      });
    }
  </script>
</body>

</html>
