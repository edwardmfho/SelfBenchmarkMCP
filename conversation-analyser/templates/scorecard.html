<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conversation Scorecard</title>
  <style>
    /* ── Design Tokens ── */
    :root {
      --bg: #0d0f18;
      --surface: #161927;
      --surface2: #1e2235;
      --border: #272b42;
      --accent: #6c63ff;
      --accent2: #00d4aa;
      --accent3: #ff6b9d;
      --text: #e2e8f0;
      --muted: #7a8499;
      --radius: 14px;
      --radius-sm: 8px;
      --shadow: 0 8px 32px rgba(0, 0, 0, .5);
      --transition: .22s cubic-bezier(.4, 0, .2, 1);
    }

    /* ── Reset & Base ── */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      padding: 2.5rem 1.5rem;
      line-height: 1.6;
    }

    /* ── Layout ── */
    .container {
      max-width: 860px;
      margin: 0 auto;
    }

    /* ── Header ── */
    .header {
      margin-bottom: 2rem;
    }

    .header h1 {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -.03em;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: .5rem;
    }

    .meta-row {
      display: flex;
      flex-wrap: wrap;
      gap: .5rem;
      align-items: center;
      margin-bottom: 1.25rem;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: .35rem;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: .25rem .75rem;
      font-size: .78rem;
      font-weight: 600;
      color: var(--muted);
      letter-spacing: .02em;
    }

    .badge .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
    }

    .badge.accent .dot {
      background: var(--accent);
    }

    .badge.accent2 .dot {
      background: var(--accent2);
    }

    .badge.accent3 .dot {
      background: var(--accent3);
    }

    /* ── Summary Box ── */
    .summary-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.5rem 1.75rem;
      margin-bottom: 2rem;
      box-shadow: var(--shadow);
      position: relative;
      overflow: hidden;
    }

    .summary-box::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
    }

    .summary-box p {
      color: var(--text);
      line-height: 1.8;
    }

    /* ── Section Title ── */
    .section-title {
      font-size: .75rem;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 2rem 0 .75rem;
    }

    /* ── Accordion Cards ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-bottom: .6rem;
      box-shadow: var(--shadow);
      overflow: hidden;
      transition: border-color var(--transition), box-shadow var(--transition);
    }

    .card:hover {
      border-color: var(--accent);
      box-shadow: 0 8px 32px rgba(108, 99, 255, .15);
    }

    .card:focus-within {
      border-color: var(--accent);
      outline: none;
    }

    .card-header {
      display: flex;
      align-items: center;
      gap: .75rem;
      padding: 1rem 1.25rem;
      cursor: pointer;
      user-select: none;
      transition: background var(--transition);
    }

    .card-header:hover {
      background: var(--surface2);
    }

    .card-icon {
      font-size: 1.1rem;
      flex-shrink: 0;
    }

    .card-title {
      flex: 1;
      font-weight: 600;
      font-size: .95rem;
    }

    .score-badge {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff;
      border-radius: 20px;
      padding: .15rem .65rem;
      font-size: .75rem;
      font-weight: 700;
      flex-shrink: 0;
    }

    .score-badge.negative {
      background: linear-gradient(135deg, #ff6b9d, #ff4757);
    }

    .score-badge.neutral {
      background: linear-gradient(135deg, #ffa502, #ff6348);
    }

    .toggle-icon {
      color: var(--muted);
      font-size: .85rem;
      flex-shrink: 0;
      transition: transform var(--transition);
    }

    .card.open .toggle-icon {
      transform: rotate(180deg);
    }

    .card-body {
      padding: 0 1.25rem;
      max-height: 0;
      overflow: hidden;
      transition: max-height .35s cubic-bezier(.4, 0, .2, 1), padding var(--transition);
      color: var(--muted);
      line-height: 1.8;
      white-space: pre-wrap;
      font-size: .9rem;
    }

    .card.open .card-body {
      max-height: 2000px;
      padding: 0 1.25rem 1.25rem;
    }

    /* ── Key Findings ── */
    .findings-list {
      list-style: none;
    }

    .findings-list li {
      display: flex;
      align-items: flex-start;
      gap: .75rem;
      padding: .75rem 0;
      border-bottom: 1px solid var(--border);
      color: var(--muted);
      font-size: .9rem;
      line-height: 1.7;
    }

    .findings-list li:last-child {
      border-bottom: none;
    }

    .findings-list li::before {
      content: "→";
      color: var(--accent2);
      font-weight: 800;
      flex-shrink: 0;
      margin-top: .05rem;
    }

    /* ── Stats Row ── */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: .75rem;
      margin-bottom: 2rem;
    }

    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 1rem 1.25rem;
      text-align: center;
    }

    .stat-value {
      font-size: 1.6rem;
      font-weight: 800;
      color: var(--accent2);
    }

    .stat-label {
      font-size: .75rem;
      color: var(--muted);
      margin-top: .2rem;
    }

    /* ── Footer ── */
    footer {
      margin-top: 3rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: .78rem;
      text-align: center;
    }

    /* ── Tooltip ── */
    [data-tooltip] {
      position: relative;
      cursor: help;
    }

    [data-tooltip]::after {
      content: attr(data-tooltip);
      position: absolute;
      bottom: calc(100% + 8px);
      left: 50%;
      transform: translateX(-50%);
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: .5rem .75rem;
      font-size: .78rem;
      color: var(--text);
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      transition: opacity var(--transition);
      z-index: 100;
      max-width: 260px;
      white-space: normal;
      text-align: left;
    }

    [data-tooltip]:hover::after {
      opacity: 1;
    }

    /* ── Responsive ── */
    @media (max-width: 600px) {
      body {
        padding: 1.25rem 1rem;
      }

      .header h1 {
        font-size: 1.5rem;
      }

      .stats-row {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>

<body>
  <div class="container">

    <!-- Header -->
    <div class="header">
      <h1 id="scorecard-title">📊 Conversation Scorecard</h1>
      <div class="meta-row" id="meta-row">
        <!-- Populated by JS -->
      </div>
    </div>

    <!-- Stats Row -->
    <div class="stats-row" id="stats-row"></div>

    <!-- Summary -->
    <div class="summary-box">
      <p id="summary-text">Loading…</p>
    </div>

    <!-- Sections -->
    <div id="sections-container"></div>

    <!-- Key Findings -->
    <div id="findings-container"></div>

    <footer>
      Generated by <strong>Conversation Analyser MCP Server</strong>
      &nbsp;·&nbsp; <span id="footer-model"></span>
    </footer>
  </div>

  <!-- INJECT: data_json -->
  <script id="scorecard-data" type="application/json">null</script>

  <script>
    // ── Embedded data (read from data element) ──
    const DATA = JSON.parse(document.getElementById('scorecard-data').textContent);

    // ── Helpers ──
    function el(tag, cls, html) {
      const e = document.createElement(tag);
      if (cls) e.className = cls;
      if (html !== undefined) e.innerHTML = html;
      return e;
    }

    function scoreClass(score) {
      if (score === null || score === undefined) return '';
      if (DATA.analysis_type === 'benchmark') return 'accent'; // Benchmark scores are always positive metrics
      if (score < -0.2) return 'negative';
      if (score < 0.2) return 'neutral';
      return '';
    }

    function scoreLabel(score) {
      if (score === null || score === undefined) return null;
      if (DATA.analysis_type === 'benchmark') return `${score}h`; // Hours for benchmark
      const pct = Math.round(((score + 1) / 2) * 100);
      return `${pct}%`;
    }

    // ── Render title ──
    document.title = `Scorecard — ${DATA.work_type} / ${DATA.analysis_type}`;
    document.getElementById('scorecard-title').textContent =
      `📊 ${DATA.work_type.replace(/_/g, ' ')} Scorecard`;

    // ── Render meta badges ──
    const metaRow = document.getElementById('meta-row');
    const badges = [
      { label: DATA.work_type.replace(/_/g, ' '), cls: 'accent' },
      { label: DATA.analysis_type.replace(/_/g, ' '), cls: 'accent2' },
      { label: DATA.model_used || 'unknown model', cls: 'accent3' },
    ];
    badges.forEach(b => {
      const badge = el('span', `badge ${b.cls}`);
      badge.innerHTML = `<span class="dot"></span>${b.label}`;
      metaRow.appendChild(badge);
    });

    // ── Render stats ──
    const statsRow = document.getElementById('stats-row');
    const stats = [
      { value: DATA.turn_count ?? '—', label: 'Turns' },
      { value: DATA.chunk_count ?? 1, label: 'Chunks analysed' },
    ];

    if (DATA.total_manual_time !== undefined) {
      stats.push({ value: DATA.total_manual_time, label: 'Total Manual Time Saved' });
    } else {
      stats.push({ value: DATA.source_format ?? '—', label: 'Format' });
    }

    stats.forEach(s => {
      const card = el('div', 'stat-card');
      card.innerHTML = `<div class="stat-value">${s.value}</div><div class="stat-label">${s.label}</div>`;
      statsRow.appendChild(card);
    });

    // ── Render summary ──
    document.getElementById('summary-text').textContent = DATA.summary || 'No summary available.';

    // ── Render sections ──
    const sectionsContainer = document.getElementById('sections-container');
    const sections = DATA.sections || [];
    if (sections.length > 0) {
      const title = el('p', 'section-title', DATA.analysis_type === 'benchmark' ? 'Work Categories' : 'Analysis Sections');
      sectionsContainer.appendChild(title);

      sections.forEach((sec, i) => {
        const card = el('div', 'card');
        const score = sec.score !== undefined ? sec.score : null;
        const scoreBadge = score !== null
          ? `<span class="score-badge ${scoreClass(score)}"
           data-tooltip="${DATA.analysis_type === 'benchmark' ? 'Estimated manual hours' : 'Sentiment score'}: ${score.toFixed(2)}">${scoreLabel(score)}</span>`
          : '';
        const icons = ['💬', '📋', '🎯', '📈', '⚡', '🔍', '💡', '🤝'];
        const icon = icons[i % icons.length];

        card.innerHTML = `
      <div class="card-header" role="button" tabindex="0"
           aria-expanded="false" aria-controls="card-body-${i}">
        <span class="card-icon">${icon}</span>
        <span class="card-title">${sec.title || 'Section'}</span>
        ${scoreBadge}
        <span class="toggle-icon">▼</span>
      </div>
      <div class="card-body" id="card-body-${i}">${sec.content || ''}</div>
    `;

        const header = card.querySelector('.card-header');
        const toggle = () => {
          const open = card.classList.toggle('open');
          header.setAttribute('aria-expanded', open);
        };
        header.addEventListener('click', toggle);
        header.addEventListener('keydown', e => {
          if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); }
        });

        sectionsContainer.appendChild(card);
      });
    }

    // ── Render key findings ──
    const findingsContainer = document.getElementById('findings-container');
    const findings = DATA.key_findings || [];
    if (findings.length > 0) {
      findingsContainer.appendChild(el('p', 'section-title', 'Key Findings'));
      const list = el('ul', 'findings-list');
      findings.forEach(f => {
        const li = el('li', '', f);
        list.appendChild(li);
      });
      findingsContainer.appendChild(list);
    }

    // ── Footer ──
    document.getElementById('footer-model').textContent = `Model: ${DATA.model_used || 'unknown'}`;

    // ── Expose data for programmatic access ──
    window.__scorecardData = DATA;
  </script>
</body>

</html>
